<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donkey Clicker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preload" as="image" href="assets/pinata.png">
  <link rel="preload" as="image" href="assets/real-donkey.png">
</head>
<body>
  <!-- HUD -->
  <div id="hud">
    <div id="score-display">Score: <span id="score">0</span></div>
    <div id="timer-display"><span id="timer">30</span>s</div>
    <div id="hud-right">
      <span id="high-display">Best: <span id="high-score">0</span></span>
      <button id="mute-btn" title="Toggle sound">🔊</button>
    </div>
  </div>

  <!-- Floating score feedback -->
  <div id="float-container"></div>

  <!-- Red flash overlay -->
  <div id="flash-overlay"></div>

  <!-- Confetti canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Game arena (targets spawn here) -->
  <div id="arena">
    <div id="overlay" class="visible">
      <h1 id="overlay-title">Donkey Clicker</h1>
      <p id="overlay-sub">Click pinata donkeys for points. Avoid the real ones!<br>Golden donkeys are worth +5!</p>
      <button id="start-btn">Start Game</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
