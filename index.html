<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donkey Clicker</title>
  <link rel="stylesheet" href="style.css">
  <!-- Preload images so they appear instantly -->
  <link rel="preload" as="image" href="assets/pinata.png">
  <link rel="preload" as="image" href="assets/real-donkey.png">
</head>
<body>
  <!-- HUD -->
  <div id="hud">
    <div id="score-display">Score: <span id="score">0</span></div>
    <div id="timer-display"><span id="timer">30</span>s</div>
    <div id="high-display">Best: <span id="high-score">0</span></div>
  </div>

  <!-- Floating score feedback -->
  <div id="float-container"></div>

  <!-- Red flash overlay for wrong clicks -->
  <div id="flash-overlay"></div>

  <!-- Game arena -->
  <div id="arena">
    <!-- Start / Game-over overlay -->
    <div id="overlay" class="visible">
      <h1 id="overlay-title">Donkey Clicker</h1>
      <p id="overlay-sub">Click the pinata donkeys for points.<br>Avoid the real ones!</p>
      <button id="start-btn">Start Game</button>
    </div>

    <!-- Donkey target (centered, hidden until spawned) -->
    <div id="donkey" class="hidden">
      <img id="donkey-img" src="" alt="donkey" draggable="false">
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
